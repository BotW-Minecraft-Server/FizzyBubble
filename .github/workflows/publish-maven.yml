name: Publish Maven

on:
  push:
    branches:
      - v2-release
  workflow_dispatch:

jobs:
  publish-maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      MAVEN_REPOSITORY_URL: https://maven.botwmcs.link/releases
      MAVEN_REPOSITORY_USERNAME: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
      MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MAVEN_REPOSITORY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Publish to BotWMCS Maven
        run: ./gradlew publish
