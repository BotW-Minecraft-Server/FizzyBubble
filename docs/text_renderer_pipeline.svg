<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <style>
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 1.5; }
      .title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #222; }
      .mono { font: 12px 'Consolas', 'Courier New', monospace; fill: #222; }
      .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="940" height="520" fill="#ffffff" stroke="#dddddd"/>
  <text x="30" y="48" class="title">TextRenderer Pipeline (Span-Merge + Render)</text>

  <rect x="40" y="80" width="220" height="80" class="box"/>
  <text x="55" y="110" class="text">Input Component</text>
  <text x="55" y="132" class="mono">text / lines / wrap</text>

  <rect x="300" y="80" width="220" height="80" class="box"/>
  <text x="315" y="110" class="text">resolveLines(font)</text>
  <text x="315" y="132" class="mono">FormattedCharSequence[]</text>

  <rect x="560" y="80" width="220" height="80" class="box"/>
  <text x="575" y="110" class="text">buildLineInfos</text>
  <text x="575" y="132" class="mono">line text + widths</text>

  <rect x="40" y="190" width="740" height="80" class="box"/>
  <text x="55" y="220" class="text">resolveStyleSpans(fullText)</text>
  <text x="55" y="242" class="mono">t2* keys -> spans (ordered)</text>

  <rect x="40" y="300" width="740" height="160" class="box"/>
  <text x="55" y="330" class="text">Per-character render loop</text>
  <text x="55" y="352" class="mono">for each line -> for each codepoint</text>
  <text x="55" y="374" class="mono">1) merge spans that contain index</text>
  <text x="55" y="396" class="mono">2) resolve color mode (color/gradient/rainbow)</text>
  <text x="55" y="418" class="mono">3) compute position (align / floating)</text>
  <text x="55" y="440" class="mono">4) drawString (shadow optional)</text>

  <rect x="40" y="480" width="740" height="50" class="box"/>
  <text x="55" y="510" class="text">Output: rasterized text in GuiGraphics</text>

  <line x1="260" y1="120" x2="300" y2="120" class="arrow"/>
  <line x1="520" y1="120" x2="560" y2="120" class="arrow"/>
  <line x1="150" y1="160" x2="150" y2="190" class="arrow"/>
  <line x1="670" y1="160" x2="670" y2="190" class="arrow"/>
  <line x1="410" y1="270" x2="410" y2="300" class="arrow"/>
  <line x1="410" y1="460" x2="410" y2="480" class="arrow"/>

  <rect x="820" y="190" width="130" height="140" class="box"/>
  <text x="832" y="218" class="text">Span Merge</text>
  <text x="832" y="240" class="mono">bool flags: OR</text>
  <text x="832" y="262" class="mono">color modes: last</text>
  <text x="832" y="284" class="mono">overlap order:</text>
  <text x="832" y="306" class="mono">insertion order</text>
  <line x1="780" y1="250" x2="820" y2="250" class="arrow"/>
</svg>
